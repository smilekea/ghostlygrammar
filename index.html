 translateX(15px) scale(1); } 60% { transform: translateX(-15px) scale(1); } 80% { transform: translateX(15px) scale(1); } }    .elt-task-board.error-state { animation: errorShake 0.5s ease-in-out !important; border-color: #ff4757 !important; box-shadow: 0 0 30px rgba(255, 71, 87, 0.8), inset 0 0 20px rgba(255, 71, 87, 0.5) !important; }    @keyframes explodeBoard { 0% { transform: scale(1); opacity: 1; filter: brightness(1); } 30% { transform: scale(1.1); filter: brightness(1.5) contrast(1.2); box-shadow: 0 0 40px #ffd700; border-color: #ffd700;} 100% { transform: scale(0); opacity: 0; filter: brightness(2); } }    .elt-task-board.exploding { animation: explodeBoard 0.5s ease-out forwards !important; pointer-events: none !important; }    .elt-fragment { position: absolute; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; z-index: 100; animation: fragmentFly 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; box-shadow: 0 0 10px rgba(255,255,255,0.5); }    @keyframes fragmentFly { 0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scale(0); opacity: 0; } }    .elt-question { font-family: 'Alice', serif !important; font-size: 24px !important; color: #ffffff !important; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); line-height: 1.4;}    .elt-ans-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;}    .elt-btn-ans, .elt-btn-main { appearance: none !important; -webkit-appearance: none !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; text-transform: uppercase !important; letter-spacing: 1px !important; line-height: normal !important; text-align: center !important; text-decoration: none !important; }    .elt-btn-ans { background-color: rgba(255,255,255,0.1) !important; color: #ffffff !important; border: 2px solid #ccc !important; padding: 10px 20px !important; border-radius: 10px !important; font-family: 'Alice', serif !important; font-size: calc(24px * 0.85) !important; cursor: pointer !important; transition: all 0.2s !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;}    .elt-btn-ans:hover { background-color: #555 !important; transform: scale(1.05) !important; border-color: #fff !important;}    .elt-btn-check { padding: 8px 20px !important; font-size: 14px !important; background-color: #333333 !important; border-color: #555555 !important; text-shadow: none !important; box-shadow: 0 4px 8px rgba(0,0,0,0.5) !important; }    .elt-btn-check:hover { background-color: #444444 !important; border-color: #777777 !important; }    .elt-btn-main { background-color: #e50914 !important; color: #ffffff !important; font-family: 'Montserrat', sans-serif !important; font-weight: 800 !important; padding: 15px 40px !important; font-size: 18px !important; border: 3px solid #e0e0e0 !important; border-radius: 12px !important; cursor: pointer !important; transition: all 0.2s !important; box-shadow: 0 0 15px rgba(224, 224, 224, 0.5), 0 4px 10px rgba(0,0,0,0.6) !important;}    .elt-btn-main:hover { background-color: #ff4757 !important; transform: scale(1.05) !important; border-color: #ffffff !important; box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 6px 15px rgba(0,0,0,0.7) !important;}    .elt-btn-custom-check { appearance: none !important; -webkit-appearance: none !important; background-color: #333333 !important; color: #ffffff !important; font-family: 'Montserrat', sans-serif !important; font-weight: 800 !important; padding: 8px 24px !important; font-size: 14px !important; border: 2px solid #555555 !important; border-radius: 10px !important; cursor: pointer !important; transition: all 0.2s !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important; text-transform: uppercase !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; }    .elt-btn-custom-check: solute; bottom: 20px; right: 5%; display: flex; gap: 20px; align-items: center; z-index: 30; opacity: 0.6; transition: 0.2s;}    .elt-controls:hover { opacity: 1; }    .elt-dpad { width: 140px; height: 140px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 4px; }    .elt-dbtn { background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #ffffff !important; cursor: pointer; user-select: none; backdrop-filter: blur(2px);}    .elt-dbtn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }    .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; } .right { grid-column: 3; grid-row: 2; } .down { grid-column: 2; grid-row: 3; }    .elt-space-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(229, 9, 20, 0.5); border: 3px solid rgba(255,255,255,0.4); color: #ffffff !important; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; backdrop-filter: blur(2px);}    .elt-space-btn:active { transform: scale(0.9); background: rgba(229, 9, 20, 0.8); }    #screen-start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; padding: 20px; background: rgba(28, 28, 30, 0.85) !important; }    .elt-title-huge { background: rgba(22, 33, 62, 0.95) !important; color: #ffffff !important; font-family: 'Pangolin', cursive !important; font-weight: 800; font-size: clamp(24px, 4vw, 50px); padding: 20px 40px !important; border-radius: 20px; border: 4px solid #ffffff; margin-bottom: 40px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 95%; line-height: normal !important; word-wrap: break-word;}    .elt-btn-huge { appearance: none !important; -webkit-appearance: none !important; background-color: #ffffff !important; color: #f46a1f !important; font-family: 'Pangolin', cursive !important; font-weight: 800 !important; font-size: clamp(20px, 3vw, 30px) !important; padding: 20px 50px !important; border: none !important; border-radius: 40px !important; cursor: pointer !important; transition: all 0.2s !important; box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; line-height: normal !important; text-transform: uppercase !important;}    .elt-btn-huge:hover { transform: scale(1.1) !important; background-color: #16203c !important; color: #ffffff !important;}    #screen-win { position: absolute; inset: 0; background: rgba(28, 28, 30, 0.85) !important; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; transition: 0.5s; overflow: hidden;}    .elt-win-img { width: 280px; height: 280px; object-fit: contain; filter: drop-shadow(0 0 25px rgba(255,255,255,0.9)); animation: floatImg 3s ease-in-out infinite; z-index: 2; margin-bottom: 20px;}    .elt-win-text { background: rgba(22, 33, 62, 0.95) !important; color: #ffffff !important; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(24px, 4vw, 50px); padding: 20px 40px !important; border-radius: 20px; border: 4px solid #fff; margin-bottom: 40px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 95%; line-height: normal !important; word-wrap: break-word; z-index: 2;}    @keyframes floatImg { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }    .elt-gold-spark { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff, 0 0 20px #ffd700, 0 0 30px #ff8c00; animation: sparkFade 1s linear forwards; pointer-events: none; z-index: 1;}    @keyframes sparkFade { 0% { transform: scale(0) translateY(0); opacity: 1; } 50% { transform: scale(1.5) translateY(-30px); opacity: 1; } 100% { transform: scale(0) translateY(-60px); opacity: 0; } }    #screen-over { position: absolute; inset: 0; background: rgba(28, 28, 30, 0.85) !important; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; transition: 0.5s; padding: 20px;}    .elt-lose-img { width: 330px; height: 330px; object-fit: cover; border-radius: 20px; border: 5px solid #e50914; margin-bottom: 25px; box-shadow: 0 0 30px rgba(229,9,20,0.5); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }    .elt-lose-text { color: #ffffff !important; font-weight: 800; font-size: min(6vw, 36px); margin-bottom: 30px; text-align: center; font-family: 'Montserrat', sans-serif;}    .elt-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; z-index: -10 !important; }    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }</style></head><body><div id="elt-app" tabindex="0">    <div class="elt-top-bar"><div style="opacity:0;"></div><div class="elt-lives" id="elt-lives"></div></div>    <div id="dots-container"></div><div id="elt-spidey"></div><div id="elt-space-hint">SPACE</div>    <div class="elt-controls">        <div class="elt-dpad">            <div class="elt-dbtn up" onpointerdown="game.move(0,-1)" onpointerup="game.stopMove()" onpointerleave="game.stopMove()">⬆️</div>            <div class="elt-dbtn left" onpointerdown="game.move(-1,0)" onpointerup="game.stopMove()" onpointerleave="game.stopMove()">⬅️</div>            <div class="elt-dbtn right" onpointerdown="game.move(1,0)" onpointerup="game.stopMove()" onpointerleave="game.stopMove()">➡️</div>            <div class="elt-dbtn down" onpointerdown="game.move(0,1)" onpointerup="game.stopMove()" onpointerleave="game.stopMove()">⬇️</div>        </div>        <div class="elt-space-btn" onclick="game.triggerSpace()">SPACE</div>    </div>    <div class="elt-task-board" id="board-task"><div class="elt-question" id="lbl-question"></div><div id="box-answers"></div></div>    <div id="screen-start"><div class="elt-title-huge">Ghost Grammar Hunt</div><button class="elt-btn-huge" id="btn-start"></button></div>    <div id="screen-over" class="elt-hidden"><img src="https://i.postimg.cc/nLdGPnYR/2.png" class="elt-lose-img"><div class="elt-lose-text">Better luck next year! Try again?</div><button class="elt-btn-main" id="btn-try"></button></div>    <div id="screen-win" class="elt-hidden"><img src="https://i.postimg.cc/VN7WVzBZ/3.png" class="elt-win-img"><div class="elt-lose-text" style="color:#ffd700">Great! You got all the candies!</div><button class="elt-btn-main" id="btn-win-restart" style="position:relative;z-index:10;"></button></div></div><script>(function(){    const dict = { EN: { start: "START", try: "RESTART", check: "CHECK", next: "NEXT", unscramble: "Put the words in the right order", playagain: "PLAY AGAIN" }, RU: { start: "ИГРАТЬ", try: "ЗАНОВО", check: "ПРОВЕРИТЬ", next: "ДАЛЕЕ", unscramble: "Расставьте слова в правильном порядке", playagain: "ИГРАТЬ ЕЩЕ РАЗ" }, ES: { start: "JUGAR", try: "REINICIAR", check: "COMPROBAR", next: "SIGUIENTE", unscramble: "Pon las palabras in el orden correcto", playagain: "JUGAR DE NUEVO" }, FR: { start: "JOUER", try: "RECOMMENCER", check: "VÉRIFIER", next: "SUIVANT", unscramble: "Mettez les mots dans le bon ordre", playagain: "REJOUER" }, DE: { start: "START", try: "NEUSTART", check: "PRÜFEN", next: "WEITER", unscramble: "Bringen Sie die Wörter in die richtige Reihenfolge", playagain: "NOCHMAL SPIELEN" }, IT: { start: "INIZIA", try: "RIAVVIA", check: "CONTROLLA", next: "AVANTI", unscramble: "Metti le parole nel giusto ordine", playagain: "GIOCA DI NUOVO" }};    const lang = dict['EN'] || dict.EN;    document.getElementById('btn-start').innerText = 'Start' || lang.start; document.getElementById('btn-try').innerText=lang.try; document.getElementById('btn-win-restart').innerText=lang.playagain;    const TASK
